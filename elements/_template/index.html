<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nuevo Elemento | Prototipo w-belm</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos del lienzo de prueba */
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #f8fafc 0%, #e2e8f0 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .demo-info {
      text-align: center;
      max-width: 520px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .demo-info h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .demo-info p {
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <!-- PANEL DE PRUEBAS: BORRAR AL INTEGRAR EN SHOPIFY -->
  <aside class="el-test-panel" id="el-test-panel" aria-label="Controles de prueba">
    <button id="el-btn-test-action" class="el-test-btn" type="button">Probar Acción</button>
    <button id="el-btn-test-theme" class="el-test-btn" type="button">Alternar Tema</button>
  </aside>
  <!-- FIN PANEL DE PRUEBAS -->

  <main class="demo-info">
    <h1>Nuevo Elemento (Plantilla)</h1>
    <p>Esta es una plantilla base para nuevos widgets y micro-interacciones de la biblioteca <code>w-belm</code>.</p>
  </main>

  <!-- === INICIO BLOQUE SHOPIFY === -->
  <div id="el-root" class="el-root">
    <!-- Contenido y estructura del elemento con prefijo el- -->
    <div class="el-container" id="el-container">
      <button class="el-interactive-btn" id="el-interactive-btn" type="button" aria-label="Elemento interactivo">
        <span>Click Me</span>
      </button>
    </div>
  </div>
  <!-- === FIN BLOQUE SHOPIFY === -->

  <script>
    (function () {
      'use strict';

      /* === INICIO BLOQUE SHOPIFY === */
      const root = document.getElementById('el-root');
      const interactiveBtn = document.getElementById('el-interactive-btn');

      if (interactiveBtn) {
        interactiveBtn.addEventListener('click', () => {
          interactiveBtn.classList.toggle('is-active');
        });
      }
      /* === FIN BLOQUE SHOPIFY === */

      /* Controles del panel de pruebas */
      const testActionBtn = document.getElementById('el-btn-test-action');
      const testThemeBtn = document.getElementById('el-btn-test-theme');

      if (testActionBtn && interactiveBtn) {
        testActionBtn.addEventListener('click', () => {
          interactiveBtn.click();
        });
      }

      if (testThemeBtn && root) {
        testThemeBtn.addEventListener('click', () => {
          root.classList.toggle('is-dark-theme');
        });
      }
    })();
  </script>
</body>

</html>
